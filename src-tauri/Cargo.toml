[package]
name = "thermal-printer-emulator"
version = "0.1.0"
description = "Thermal printer emulator and virtual thermal printer for ESC/POS"
authors = ["Willian Barbosa Lima do Nascimento"]
license = "MIT"
repository = "https://github.com/AstrOOnauta/thermal-printer-emulator"
edition = "2021"
publish = false

[lib]
# `_lib` keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "thermal_printer_emulator_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
qrcode = { version = "0.14", default-features = false }
sys-locale = "0.3"
# Same major as Tauri's runtime: tasks run on `tauri::async_runtime`.
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# A panic in a connection task must drop that connection, not the whole app.
panic = "unwind"
strip = true
