# Weekly updates. Minor and patch bumps are grouped into one PR per ecosystem; majors come
# alone, since they are the ones that break. Titles follow Conventional Commits.
# Tauri ships as an npm package and a crate whose versions must match: merge the two
# Tauri PRs together.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']
