name: CI

on:
  push:
    branches: [main]
  pull_request:
  # "Run workflow" in the Actions tab: the only way to get installers outside a release.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LINUX_DEPS: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      # Installs the toolchain pinned in rust-toolchain.toml (clippy + rustfmt included).
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # A red run still saves the compiled crates: the next one does not start cold.
          cache-on-failure: true
      - run: yarn install --immutable
      - run: yarn check

  # `checks` only compiles the Linux code. `#[cfg(target_os = "macos")]` (Dock, app menu) and
  # `#[cfg(windows)]` code gets its clippy and test run here, on every push and PR.
  platforms:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      # `generate_context!` needs the frontend dir to exist; clippy and tests never load it.
      - run: mkdir -p dist
        shell: bash
      - working-directory: src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

  # Unsigned installers, on demand only: a macOS build takes ~15 min and would hold up every
  # PR. Published installers come from release.yml.
  build:
    if: github.event_name == 'workflow_dispatch'
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: rustup toolchain install
      - if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: yarn install --immutable
      - run: yarn tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.os }}
          path: src-tauri/target/**/release/bundle/
          if-no-files-found: error
