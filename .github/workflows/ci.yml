name: CI

# Checks and tests only: what the README's "tests" badge shows. Installers come from
# build.yml (on demand) and release.yml (on a version tag).
on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs these first: no release from a red commit.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LINUX_DEPS: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      # Installs the toolchain pinned in rust-toolchain.toml (clippy + rustfmt included).
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # A red run still saves the compiled crates: the next one does not start cold.
          cache-on-failure: true
      - run: yarn install --immutable
      - run: yarn check

  # `checks` only compiles the Linux code. `#[cfg(target_os = "macos")]` (Dock, app menu) and
  # `#[cfg(windows)]` code gets its clippy and test run here, on every push and PR.
  platforms:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      # `generate_context!` needs the frontend dir to exist; clippy and tests never load it.
      - run: mkdir -p dist
        shell: bash
      - working-directory: src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test
